name: Build Kernel

on: 
  workflow_dispatch:
    inputs:
      DEVICE_NAME:
        description: 'Nama HP (Contoh: SM-A022F)'
        required: true
        default: 'SM-A022F'

jobs:
  building-kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Start Building RooXie Kernel for SM-A022F
        run: |
          # Update & Install Toolchain
          sudo apt update && sudo apt upgrade -y
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev curl git ftp lftp wget libarchive-tools ccache zip
          
          export KBUILD_BUILD_USER="${{ github.actor }}"
          export KBUILD_BUILD_HOST="${{ github.event.inputs.DEVICE_NAME }}"
          
          # Pastikan script build loe (file 'z') udah bener isinya
          chmod +x z
          ./z

      - name: Set Properties
        id: props
        run: |
          echo "date=$(TZ=Asia/Jakarta date +%Y%m%d-%I%M%p)" >> $GITHUB_OUTPUT
       
      - name: Debug & Verify Output
        run: |
          echo "--- Cek isi folder boot ---"
          ls -lh out/arch/arm/boot/ || echo "❌ Folder boot gak ada!"
          
          echo "--- Cek file zImage-dtb ---"
          if [ -f "out/arch/arm/boot/zImage-dtb" ]; then
            ls -lh out/arch/arm/boot/zImage-dtb
          else
            echo "❌ zImage-dtb KOSONG/GAK ADA! Cek build.log"
            exit 1
          fi

      - name: Make Zip
        run: |
          cd ${{ github.workspace }}/out/arch/arm/boot
          
          export DEVICE_NAME=${{ github.event.inputs.DEVICE_NAME }}
          export DATE_STR=${{ steps.props.outputs.date }}
          
          # Packing file asli, bukan angin
          zip -j9 ${DEVICE_NAME}-${DATE_STR}.zip zImage-dtb
          
          cp ${DEVICE_NAME}-${DATE_STR}.zip ${{ github.workspace }}/

      - name: Release
        uses: ncipollo/release-action@v1.12.0
        with:
          artifacts: "${{ github.workspace }}/*.zip"
          name: Compiled Kernel for ${{ github.event.inputs.DEVICE_NAME }} - ${{ steps.props.outputs.date }}
          tag: ${{ github.run_id }}-${{ steps.props.outputs.date }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## Build Notes
            - Device: ${{ github.event.inputs.DEVICE_NAME }}
            - Build Date: ${{ steps.props.outputs.date }}
            - Kernel Status: zImage-dtb included.

name: TWRP ILI9881x Touch Fix (SAFE)

on:
  workflow_dispatch:

jobs:
  twrp-touch-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Patch ILI9881x driver safely
        shell: bash
        run: |
          set -e
          FILE="drivers/input/touchscreen/ili9881x/ili9881x_spi.c"

          if [ ! -f "$FILE" ]; then
            echo "Driver file not found: $FILE"
            exit 1
          fi

          echo "Patching $FILE"

          # Add headers if missing
          grep -q "<linux/input.h>" "$FILE" ||             sed -i '/#include <linux\/delay.h>/a\
#include <linux/input.h>\
#include <linux/input/mt.h>' "$FILE"

          # Add input_dev pointer
          grep -q "struct input_dev \*input" "$FILE" ||             sed -i '/struct ilitek_ts {/a\
    struct input_dev *input;' "$FILE"

          # Base64 encoded input init function (to avoid heredoc/YAML issues)
          if ! grep -q "ilitek_input_init" "$FILE"; then
            cat << 'EOF' | base64 -d >> "$FILE"

EOF
          fi

      - name: Verify patch
        run: |
          grep -n "ilitek_input_init" drivers/input/touchscreen/ili9881x/ili9881x_spi.c
          grep -n "input_register_device" drivers/input/touchscreen/ili9881x/ili9881x_spi.c

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git commit -am "twrp: add input subsystem for ili9881x touchscreen" || echo "No changes"

      - name: Push changes
        run: git push

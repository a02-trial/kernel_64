name: Fix Reboot Bug Samsung A02

on:
  workflow_dispatch: # Jalankan manual

jobs:
  apply_patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: coba_build

      - name: "Patching Watchdog & Warm Reboot"
        run: |
          # 1. Target file SoC (ap_mtk_mt6739.dtsi)
          SOC_DTSI="arch/arm/boot/dts/ap_mtk_mt6739.dtsi"
          # 2. Target file Board Common (mt6739-a02_common.dtsi)
          BOARD_DTSI="arch/arm/boot/dts/a02/mt6739-a02_common.dtsi"

          echo "Mengincar file: $SOC_DTSI dan $BOARD_DTSI"

          # PATCH 1: Aktifkan Watchdog di level SoC
          if [ -f "$SOC_DTSI" ]; then
            echo "Aktifkan WDT di SoC level..."
            # Ubah status disabled jadi okay pada node wdt
            sed -i '/wdt: watchdog@10007000 {/,/status = "disabled";/s/status = "disabled";/status = "okay";/' "$SOC_DTSI"
            
            # Tambahkan instruksi warm-reboot agar hardware tahu ini REBOOT, bukan SHUTDOWN
            if ! grep -q "mediatek,warm-reboot" "$SOC_DTSI"; then
              sed -i '/status = "okay";/a \		mediatek,warm-reboot;' "$SOC_DTSI"
            fi
          fi

          # PATCH 2: Pastikan Board Level nggak nge-override jadi disabled
          if [ -f "$BOARD_DTSI" ]; then
            echo "Memastikan WDT aktif di Board level..."
            if grep -q "&wdt" "$BOARD_DTSI"; then
               # Kalau sudah ada node &wdt, pastikan statusnya okay
               sed -i '/&wdt {/,/status = "disabled";/s/status = "disabled";/status = "okay";/' "$BOARD_DTSI"
            else
               # Kalau belum ada, tambahin di paling bawah
               echo -e "\n&wdt {\n\tstatus = \"okay\";\n};" >> "$BOARD_DTSI"
            fi
          fi

          echo "Selesai! Cek hasil di bawah:"
          echo "=== SoC WDT ==="
          grep -A 5 "watchdog@10007000" "$SOC_DTSI" || echo "Node tidak ditemukan"
          echo "=== Board WDT ==="
          tail -n 10 "$BOARD_DTSI"

      - name: "Commit & Push Perbaikan"
        run: |
          git config --global user.name "Kernel Fixer"
          git config --global user.email "fix@kernel.com"
          git add .
          git commit -m "fix: enable watchdog and warm-reboot for SM-A022F" || echo "Gak ada perubahan"
          git push origin coba_build

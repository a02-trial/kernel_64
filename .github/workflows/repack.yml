name: Unpack Repack Recovery

on:
  workflow_dispatch:

jobs:
  repack-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup AIK-Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full cpio python3
          
          # Clone dan langsung hajar chmod dalam satu baris perintah
          git clone https://github.com/osm0sis/Android-Image-Kitchen.git AIK && chmod -R 755 AIK && chmod 755 AIK/*.sh
          
          # Cek isi folder buat mastiin (buat debug di log)
          ls -R AIK

      - name: Repack Process
        run: |
          # Pastikan file ada
          ls -l recovery.img zImage
          
          # Copy amunisi
          cp recovery.img AIK/
          cp zImage AIK/zImage_new
          
          # Pindah ke folder AIK
          cd AIK
          
          echo "--- PROSES UNPACK ---"
          ./unpackimg.sh recovery.img
          
          echo "--- PROSES SWAP KERNEL ---"
          # Tiban kernel lama
          cp zImage_new split_img/recovery.img-kernel
          
          echo "--- PROSES REPACK ---"
          ./repackimg.sh
          
          # Balik ke folder awal buat upload
          DATE_TIME=$(TZ='Asia/Jakarta' date +"%d%b_%I_%M%p")
          mv image-new.img ../TWRP-A02-RooXie-${DATE_TIME}.img

      - name: Upload Repacked Recovery
        uses: actions/upload-artifact@v4
        with:
          name: Recovery-TWRP-A02
          path: TWRP-A02-*.img

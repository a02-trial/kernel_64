name: Unpack Repack Recovery

on:
  workflow_dispatch:

jobs:
  repack-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup AIK (The Right Way)
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full cpio python3 curl
          
          # 1. Clone AIK-Linux (Branch yang lu sidak tadi)
          git clone --depth=1 -b AIK-Linux https://github.com/osm0sis/Android-Image-Kitchen.git AIK
          
          # 2. DOWNLOAD BINARY DARI REPO PUBLIC LAIN
          # Karena osm0sis misahin binary-nya, kita ambil dari penyedia binary yang open
          mkdir -p AIK/bin/linux/x86_64
          
          # Kita download langsung unpackbootimg & mkbootimg (dua sejoli paling penting)
          curl -L https://raw.githubusercontent.com/carliv/Android_Image_Kitchen_64bit/master/bin/linux/x86_64/unpackbootimg -o AIK/bin/linux/x86_64/unpackbootimg
          curl -L https://raw.githubusercontent.com/carliv/Android_Image_Kitchen_64bit/master/bin/linux/x86_64/mkbootimg -o AIK/bin/linux/x86_64/mkbootimg
          
          # 3. Kasih izin eksekusi
          chmod -R 755 AIK
          chmod +x AIK/bin/linux/x86_64/*

      - name: Repack Process
        run: |
          # Bahan-bahan
          cp recovery.img AIK/
          cp zImage AIK/zImage_new
          
          cd AIK || exit 1
          
          echo "--- CEK BINARY ---"
          ls -l bin/linux/x86_64/
          
          echo "--- PROSES UNPACK ---"
          # Paksa jalanin unpack
          bash unpackimg.sh recovery.img
          
          echo "--- SWAP KERNEL ---"
          if [ -d "split_img" ]; then
             cp zImage_new split_img/recovery.img-kernel
             echo "Kernel diganti!"
          else
             echo "ERROR: split_img gak muncul. Log sistem:"
             ls -R
             exit 1
          fi
          
          echo "--- PROSES REPACK ---"
          bash repackimg.sh
          
          echo "--- ANGKUT HASIL ---"
          DATE_TIME=$(TZ='Asia/Jakarta' date +"%d%b_%I_%M%p")
          if [ -f "image-new.img" ]; then
             mv image-new.img ../TWRP-A02-RooXie-${DATE_TIME}.img
          else
             echo "ERROR: image-new.img gagal!" && exit 1
          fi

      - name: Upload Repacked Recovery
        uses: actions/upload-artifact@v4
        with:
          name: Recovery-TWRP-A02
          path: TWRP-A02-*.img

name: Unpack Repack Recovery

on:
  workflow_dispatch:

jobs:
  repack-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup AIK-Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full cpio python3
          
          # Clone AIK
          git clone https://github.com/osm0sis/Android-Image-Kitchen.git AIK
          
          # Hajar permission pake jalur folder yang pasti ketemu
          chmod -R 755 AIK

      - name: Repack Process
        run: |
          # 1. Pastikan file ada di depan mata
          ls -l recovery.img zImage
          
          # 2. Masukin file ke folder AIK
          cp recovery.img AIK/
          cp zImage AIK/zImage_new
          
          # 3. Pindah ke folder AIK dan eksekusi
          cd AIK
          
          echo "--- PROSES UNPACK ---"
          # Pake 'sh' buat manggil scriptnya biar lebih kuat
          sh unpackimg.sh recovery.img
          
          echo "--- GANTI KERNEL ---"
          cp zImage_new split_img/recovery.img-kernel
          
          echo "--- PROSES REPACK ---"
          sh repackimg.sh
          
          # 4. Angkut hasilnya keluar
          DATE_TIME=$(TZ='Asia/Jakarta' date +"%d%b_%I_%M%p")
          mv image-new.img ../TWRP-A02-RooXie-${DATE_TIME}.img

      - name: Upload Repacked Recovery
        uses: actions/upload-artifact@v4
        with:
          name: Recovery-TWRP-A02
          path: TWRP-A02-*.img

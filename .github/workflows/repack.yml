name: Unpack Repack Recovery

on:
  workflow_dispatch:

jobs:
  repack-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup AIK-Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full cpio python3
          
          # Clone langsung ke folder spesifik
          git clone https://github.com/osm0sis/Android-Image-Kitchen.git ${GITHUB_WORKSPACE}/AIK
          
          # Hajar permission semua file di dalemnya
          chmod -R 755 ${GITHUB_WORKSPACE}/AIK

      - name: Repack Process
        run: |
          # 1. Definisikan folder AIK biar gak ngetik panjang
          AIK_DIR="${GITHUB_WORKSPACE}/AIK"
          
          # 2. Copy file utama ke dalem AIK
          cp ${GITHUB_WORKSPACE}/recovery.img ${AIK_DIR}/
          cp ${GITHUB_WORKSPACE}/zImage ${AIK_DIR}/zImage_new
          
          # 3. Jalankan script langsung dari foldernya (tanpa cd)
          echo "--- PROSES UNPACK ---"
          bash ${AIK_DIR}/unpackimg.sh ${AIK_DIR}/recovery.img
          
          echo "--- GANTI KERNEL ---"
          # AIK bakal bikin folder split_img di dalem folder AIK
          cp ${AIK_DIR}/zImage_new ${AIK_DIR}/split_img/recovery.img-kernel
          
          echo "--- PROSES REPACK ---"
          bash ${AIK_DIR}/repackimg.sh --workingdir ${AIK_DIR}
          
          # 4. Ambil hasilnya (biasanya image-new.img ada di folder tempat script dijalankan)
          DATE_TIME=$(TZ='Asia/Jakarta' date +"%d%b_%I_%M%p")
          
          # Cek dulu filenya ada dimana, lalu pindahin
          find ${AIK_DIR} -name "image-new.img" -exec mv {} ${GITHUB_WORKSPACE}/TWRP-A02-RooXie-${DATE_TIME}.img \;

      - name: Upload Repacked Recovery
        uses: actions/upload-artifact@v4
        with:
          name: Recovery-TWRP-A02
          path: TWRP-A02-*.img

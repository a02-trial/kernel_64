name: Unpack Repack Recovery

on:
  workflow_dispatch:

jobs:
  repack-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup & Process AIK
        run: |
          # 1. Install alat tempur
          sudo apt-get update
          sudo apt-get install -y p7zip-full cpio python3
          
          # 2. Clone AIK ke folder 'AIK'
          git clone https://github.com/osm0sis/Android-Image-Kitchen.git AIK
          
          # 3. Kasih izin eksekusi (Full Power)
          chmod -R 755 AIK
          
          # 4. Ambil amunisi dari root repo masukin ke folder AIK
          cp recovery.img AIK/
          cp zImage AIK/zImage_new
          
          # 5. Eksekusi BERTAHAP (Gak pake subshell biar stabil)
          cd AIK || exit 1
          
          echo "--- MULAI UNPACK ---"
          # Panggil pake bash dan jalur lengkap
          bash ./unpackimg.sh recovery.img
          
          echo "--- GANTI KERNEL ---"
          # Cek folder split_img muncul gak
          if [ -d "split_img" ]; then
             cp zImage_new split_img/recovery.img-kernel
          else
             echo "ERROR: Folder split_img gak muncul!" && exit 1
          fi
          
          echo "--- MULAI REPACK ---"
          bash ./repackimg.sh
          
          echo "--- PINDAH HASIL ---"
          DATE_TIME=$(TZ='Asia/Jakarta' date +"%d%b_%I_%M%p")
          if [ -f "image-new.img" ]; then
             mv image-new.img ../TWRP-A02-RooXie-${DATE_TIME}.img
          else
             echo "ERROR: image-new.img GAGAL DICETAK!" && exit 1
          fi

      - name: Upload Repacked Recovery
        uses: actions/upload-artifact@v4
        with:
          name: Recovery-TWRP-A02
          path: TWRP-A02-*.img

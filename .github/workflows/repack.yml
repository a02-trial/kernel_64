name: Unpack Repack Recovery

on:
  workflow_dispatch: # Biar bisa lu klik manual dari tab Actions

jobs:
  repack-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup AIK-Linux
        run: |
          # Fix: Buang image-sig-verifier yang bikin error
          sudo apt-get update
          sudo apt-get install -y p7zip-full cpio python3
          
          # Clone Android Image Kitchen versi Linux
          git clone https://github.com/osm0sis/Android-Image-Kitchen.git AIK
          
          # Fix: Pastikan semua tool binary punya izin eksekusi
          chmod -R 755 AIK/*.sh
          find AIK/tools -type f -executable -exec chmod 755 {} +

      - name: Repack Process
        run: |
          # 1. Cek isi direktori
          ls
          echo $(pwd)
          
          # 2. Copy recovery lama lu ke sini (Sesuai editan lu)
          cd ${GITHUB_WORKSPACE}
          cp recovery.img AIK/.
          
          # 3. Unpack recovery lama
          cd AIK
          ./unpackimg.sh recovery.img
          
          # 4. Ganti kernel di dalam folder split_img (Sesuai editan lu)
          cd ${GITHUB_WORKSPACE}
          cp zImage AIK/split_img/recovery.img-kernel
          
          # 5. Repack lagi jadi image baru
          cd AIK
          ./repackimg.sh
          
          # 6. Kasih nama unik pake timestamp (Sesuai editan lu)
          DATE_TIME=$(date +"%d%b_%I_%M%p")
          mv image-new.img ../TWRP-A02-${DATE_TIME}.img

      - name: Upload Repacked Recovery
        uses: actions/upload-artifact@v4
        with:
          name: Recovery-TWRP-A02
          path: TWRP-A02-*.img

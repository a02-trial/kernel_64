name: Unpack Repack Recovery

on:
  workflow_dispatch:

jobs:
  repack-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup & Process AIK
        run: |
          # 1. Alat tempur
          sudo apt-get update
          sudo apt-get install -y p7zip-full cpio python3
          
          # 2. CLONE BRANCH YANG BENER (AIK-Linux)
          # Gara-gara ini kita begadang bro! wkwkwk
          git clone --depth=1 -b AIK-Linux https://github.com/osm0sis/Android-Image-Kitchen.git AIK
          
          # 3. Kasih izin eksekusi
          chmod -R 755 AIK
          
          # 4. Ambil amunisi masukin ke dapur AIK
          cp recovery.img AIK/
          cp zImage AIK/zImage_new
          
          # 5. Eksekusi di dalem folder AIK
          cd AIK || exit 1
          
          echo "--- CEK ISI FOLDER (Biar Mantap) ---"
          ls -F
          
          echo "--- PROSES UNPACK ---"
          ./unpackimg.sh recovery.img
          
          echo "--- SWAP KERNEL ---"
          if [ -d "split_img" ]; then
             cp zImage_new split_img/recovery.img-kernel
             echo "Kernel diganti!"
          else
             echo "ERROR: Unpack gagal, split_img gak ada!" && exit 1
          fi
          
          echo "--- PROSES REPACK ---"
          ./repackimg.sh
          
          echo "--- ANGKUT HASIL ---"
          DATE_TIME=$(TZ='Asia/Jakarta' date +"%d%b_%I_%M%p")
          if [ -f "image-new.img" ]; then
             mv image-new.img ../TWRP-A02-RooXie-${DATE_TIME}.img
          else
             echo "ERROR: image-new.img gak kebuat!" && exit 1
          fi

      - name: Upload Repacked Recovery
        uses: actions/upload-artifact@v4
        with:
          name: Recovery-TWRP-A02
          path: TWRP-A02-*.img

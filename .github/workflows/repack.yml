name: Unpack Repack Recovery

on:
  workflow_dispatch:

jobs:
  repack-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup AIK
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full cpio python3
          git clone --depth=1 https://github.com/SebaUbuntu/AIK-Linux-mirror.git AIK
          chmod -R 755 AIK
          find AIK/bin -type f -exec chmod 755 {} +

      - name: Repacking
        run: |
          cp recovery.img AIK/
          mv zImage* zImage
          cp zImage AIK/zImage_new
          cd AIK || exit 1
          ls -l bin/linux/x86_64/
          bash unpackimg.sh recovery.img

          if [ -d "split_img" ]; then
             cp zImage_new split_img/recovery.img-kernel
             echo "Kernel swap!"
          else
             echo "ERROR: split_img failed!"
             exit 1
          fi

          bash repackimg.sh

          DATE_TIME=$(TZ='Asia/Jakarta' date +"%d%b_%I_%M%p")
          if [ -f "image-new.img" ]; then
             mv image-new.img ../recovery.img
             echo "REPACK SUCCESSED!"
          else
             echo "ERROR: image-new.img not found!" && exit 1
          fi

      - name: Upload Repacked Recovery
        uses: actions/upload-artifact@v4
        with:
          name: Recovery-TWRP-A02-IMG
          path: recovery.img

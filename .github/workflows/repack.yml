name: Unpack Repack Recovery

on:
  workflow_dispatch:

jobs:
  repack-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup & Process AIK
        run: |
          # 1. Install Alat Tempur
          sudo apt-get update
          sudo apt-get install -y p7zip-full cpio python3
          
          # 2. Clone AIK
          git clone --depth=1 https://github.com/osm0sis/Android-Image-Kitchen.git AIK
          
          # 3. Ambil lokasi absolut biar gak nyasar
          ROOT_DIR=$(pwd)
          AIK_PATH=$(find $ROOT_DIR/AIK -name "unpackimg.sh" -exec dirname {} \;)
          
          echo "Lokasi AIK ditemukan di: $AIK_PATH"
          
          # 4. Masuk ke lokasi AIK dan CHMOD
          cd $AIK_PATH
          chmod -R 755 .
          chmod -R 755 tools/
          
          # 5. Copy file dari root repo ke lokasi AIK
          cp $ROOT_DIR/recovery.img .
          cp $ROOT_DIR/zImage ./zImage_new
          
          echo "--- PROSES UNPACK ---"
          # Paksa eksekusi pake BASH langsung
          bash unpackimg.sh recovery.img
          
          echo "--- SWAP KERNEL ---"
          if [ -d "split_img" ]; then
             cp zImage_new split_img/recovery.img-kernel
             echo "Kernel berhasil diganti!"
          else
             echo "ERROR: split_img gak ketemu! Log unpack:"
             ls -R
             exit 1
          fi
          
          echo "--- PROSES REPACK ---"
          bash repackimg.sh
          
          echo "--- PINDAH HASIL ---"
          DATE_TIME=$(TZ='Asia/Jakarta' date +"%d%b_%I_%M%p")
          if [ -f "image-new.img" ]; then
             mv image-new.img $ROOT_DIR/TWRP-A02-RooXie-${DATE_TIME}.img
             echo "Repack Berhasil!"
          else
             echo "ERROR: image-new.img tidak tercipta!"
             exit 1
          fi

      - name: Upload Repacked Recovery
        uses: actions/upload-artifact@v4
        with:
          name: Recovery-TWRP-A02
          path: TWRP-A02-*.img

name: Build A02 Kernel

on:
  push:
    branches: [ "186" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: 186

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev python3 ccache

      - name: Force rebuild ili9881x (bypass cache)
        run: touch drivers/input/touchscreen/ili9881x/*.c

      - name: Setup PATH for toolchain
        run: echo "$(pwd)/toolchain/clang/bin:$(pwd)/toolchain/gcc/bin" >> $GITHUB_PATH

      - name: Make defconfig
        run: |
          make O=out \
            ARCH=arm \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=arm-linux-androideabi- \
            KCFLAGS=-w \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
            a02_defconfig

      - name: Apply sed patch (ili9881x.c)
        run: sed -i 's/ilits->input_dev/ilits->input/g' drivers/input/touchscreen/ili9881x/ili9881x.c

      - name: Build kernel
        run: |
          make O=out \
            ARCH=arm \
            CC=clang \
            HOSTCC=clang \
            CROSS_COMPILE=arm-linux-androideabi- \
            KCFLAGS=-w \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
            -j$(nproc --all) 2>&1 | tee build.log

      - name: Verify patch masuk ke zImage
        run: |
          echo "=== Cek patch ili9881x_init ==="
          strings out/arch/arm/boot/zImage | grep -c "5ms delay" || echo "PATCH BELUM MASUK!"
          strings out/arch/arm/boot/zImage | grep -i "pll_clk_wakeup\|Write dummy" | head -5

      - name: Upload zImage
        uses: actions/upload-artifact@v4
        with:
          name: zImage-a02-${{ github.run_number }}
          path: out/arch/arm/boot/zImage

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.run_number }}
          path: build.log

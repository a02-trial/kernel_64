name: TWRP Touchscreen Fix (ILI9881x)

on:
  workflow_dispatch:

jobs:
  twrp-touch-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Locate ili9881x driver
        id: find
        run: |
          FILE=$(find . -name "*ili9881x*.c" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ili9881x driver not found"
            exit 1
          fi
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "Found: $FILE"

      - name: Inject TWRP input support
        run: |
          FILE="${{ steps.find.outputs.file }}"

          # add headers if missing
          grep -q "<linux/input.h>" "$FILE" || \
            sed -i '/#include <linux\/delay.h>/a #include

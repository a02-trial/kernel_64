name: Patch TWRP Touchscreen (ILI9881x)

on:
  workflow_dispatch:

jobs:
  apply-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate ili9881x source
        run: |
          find . -name "*ili9881x*.c"

      - name: Apply TWRP input patch
        run: |
          git apply --verbose patches/ili9881x_twrp_input_fix.patch

      - name: Verify patch applied
        run: |
          grep -R "input_register_device" . | head -n 5

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git status
          git commit -am "twrp: fix ilitek touchscreen input subsystem" || echo "Nothing to commit"

      - name: Push changes
        run: git push

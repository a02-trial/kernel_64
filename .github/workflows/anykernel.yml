name: Any Kernel

on: workflow_dispatch

jobs:
  building-kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Repack with AnyKernel3
        run: |
          # 1. Clone AnyKernel3 repo terbaru
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel
          
          # 2. Hapus file bawaan yang gak perlu
          rm -rf AnyKernel/.git
          rm -f AnyKernel/anykernel.sh
          
          # 3. Download/Ambil template anykernel.sh yang sudah disesuaikan
          # Kita bikin file anykernel.sh baru pake 'cat' biar presisi
          cat <<EOF > AnyKernel/anykernel.sh
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers

          properties() { '
          kernel.string=Kernel for Samsung A02
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=a02
          device.name2=a022f
          device.name3=SM-A022F
          '; }

          # Shell variables
          block=/dev/block/by-name/recovery;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          # Import foring tools
          . tools/ak3-core.sh;

          # Boot methods
          split_boot;
          flash_boot;
          EOF

          # 4. Copy zImage hasil build ke folder AnyKernel
          # Sesuaikan path 'out/arch/arm/boot/zImage' dengan hasil build lu
          cp ${GITHUB_WORKSPACE}/zImage AnyKernel/zImage
          
          # 5. Zip folder AnyKernel jadi file siap flash
          cd AnyKernel
          zip -r9 ../AnyKernel3-A02-Kernnel.zip * -x .git README.md
          cd ..

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-A02
          path: AnyKernel3-A02.zip
